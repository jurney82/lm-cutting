<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>LM 가이드 레일 절단 최적화 v7</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#f1f5f9;}
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button{opacity:1;}
    @media print{
      .no-print{display:none!important;}
      body{background:white;}
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef } = React;

// ── 피치 DB ──────────────────────────────────────────────
const PITCH_DB = {
  HSR:  { 15:60,20:60,25:60,30:80,35:80,45:105,55:120,65:150 },
  SR:   { 15:60,20:60,25:60,30:80,35:80 },
  SHS:  { 15:60,20:60,25:60,30:80,35:80,45:105,55:120 },
  SRS:  { 9:20,12:25,15:40 },
  SRSW: { '9W':30,'12W':40,'15W':40 },
};
const SPEC_NUMS = {
  HSR: [15,20,25,30,35,45,55,65],
  SR:  [15,20,25,30,35],
  SHS: [15,20,25,30,35,45,55],
  SRS: [9,12,15],
  SRSW:['9W','12W','15W'],
};
const SERIES_COLORS = { HSR:'#0369a1',SR:'#0891b2',SHS:'#0d9488',SRS:'#6d28d9',SRSW:'#9333ea' };

// 절단 요구별 색상 팔레트
const PALETTE = [
  '#2563eb','#dc2626','#7c3aed','#0891b2',
  '#d97706','#059669','#ea580c','#db2777',
  '#4f46e5','#0f766e','#65a30d','#9333ea',
];

const uid  = () => Math.random().toString(36).slice(2,8);
const today= () => new Date().toISOString().slice(0,10).replace(/-/g,'');
const n    = v => parseFloat(v)||0;
const ni   = v => parseInt(v)||0;
const MAX_CUT = 50;

// ── G값 피치 검증 ────────────────────────────────────────
// 반환: null(피치DB없음) | {ok,holes,pitch,suggestions?}
function validateG(series, number, cutLength, frontG, backG) {
  const pitch = PITCH_DB[series]?.[number];
  if (!pitch || !cutLength) return null;
  const cL=n(cutLength), fG=n(frontG), bG=n(backG);
  const net = cL - fG - bG;
  if (net <= 0) return { ok:false, pitch, error:'G값 합이 절단길이 초과', suggestions:[] };
  const exactHoles = net / pitch;
  const roundH = Math.round(exactHoles);
  // 0.5mm 이하 오차면 OK
  if (Math.abs(net - roundH * pitch) <= 0.5) {
    return { ok:true, pitch, holes:roundH };
  }
  // 오류: 전후 홀수 기준 대칭 G값 제안
  const suggestions = [];
  for (const h of [Math.floor(exactHoles), Math.ceil(exactHoles)]) {
    if (h < 1) continue;
    const rem = cL - h * pitch;
    if (rem < 0) continue;
    const gSym = rem / 2;
    suggestions.push({ holes:h, gSym:gSym.toFixed(1) });
  }
  return { ok:false, pitch, holes:exactHoles.toFixed(2), net:net.toFixed(1), suggestions };
}

// ── FFD 최적화 ───────────────────────────────────────────
function optimize(rawMats, cutReqs, kerf, minRemainder, stdLength) {
  const k=n(kerf), stdL=n(stdLength)||3000;
  const cuts=[];
  cutReqs.forEach((req,ri)=>{
    for(let p=0;p<(ni(req.qty)||1);p++){
      cuts.push({...req,cutLen:n(req.cutLength),reqIdx:ri,piece:p+1,
        specKey:`${req.series}${req.number}`});
    }
  });
  cuts.sort((a,b)=>b.cutLen-a.cutLen);

  const bins=rawMats.map(rm=>{
    const eff=n(rm.length)-n(rm.frontG)-n(rm.backG);
    return{...rm,id:rm.id||uid(),effectiveLength:eff,remaining:eff,
      assignments:[],specKey:`${rm.series}${rm.number}`,autoAdded:false};
  });
  const tooLong=[];

  cuts.forEach(cut=>{
    const need=cut.cutLen+k;
    let assigned=false;
    for(const bin of bins){
      if(bin.specKey!==cut.specKey) continue;
      if(bin.remaining>=need-0.001){
        bin.assignments.push({...cut,need});
        bin.remaining=Math.max(0,bin.remaining-need);
        assigned=true; break;
      }
    }
    if(!assigned){
      if(need>stdL){tooLong.push(cut);return;}
      const nb={id:uid(),series:cut.series,number:cut.number,
        length:stdL,frontG:0,backG:0,effectiveLength:stdL,
        remaining:stdL-need,assignments:[{...cut,need}],
        specKey:cut.specKey,autoAdded:true};
      bins.push(nb);
    }
  });
  return{bins,tooLong};
}

// 동일 패턴 그룹핑
function groupPatterns(bins){
  const groups=[];
  bins.forEach(bin=>{
    const sig=`${bin.specKey}|${bin.length}|`+
      bin.assignments.map(a=>`${a.series}${a.number}-${a.cutLen}-${a.frontG}-${a.backG}`).join('|');
    const ex=groups.find(g=>g.sig===sig);
    if(ex) ex.count++;
    else groups.push({sig,bin,count:1,autoAdded:bin.autoAdded});
  });
  return groups;
}

// 절단 요구별 색상 맵
function buildColorMap(cutReqs){
  const map={};
  cutReqs.forEach((cr,i)=>{
    const key=`${cr.series}${cr.number}-${cr.cutLength}`;
    if(!map[key]) map[key]=PALETTE[Object.keys(map).length%PALETTE.length];
  });
  return map;
}

// ── SpecGrid ─────────────────────────────────────────────
function SpecGrid({selected,onSelect}){
  return(
    <div style={{background:'white',border:'1px solid #e2e8f0',borderRadius:8,padding:'8px 10px',marginBottom:8}}>
      {Object.entries(SPEC_NUMS).map(([series,nums])=>{
        const col=SERIES_COLORS[series];
        const isSel=selected.series===series;
        return(
          <div key={series} style={{display:'flex',alignItems:'center',marginBottom:4,gap:4}}>
            <span style={{width:44,fontSize:11,fontWeight:800,color:isSel?col:'#94a3b8',fontFamily:'monospace',flexShrink:0}}>
              {series}
            </span>
            <div style={{display:'flex',flexWrap:'wrap',gap:3}}>
              {nums.map(num=>{
                const sel=isSel&&String(selected.number)===String(num);
                return(
                  <button key={num} onClick={()=>onSelect(series,String(num))} style={{
                    padding:'3px 9px',fontSize:12,fontWeight:sel?800:500,borderRadius:5,cursor:'pointer',
                    border:sel?`2px solid ${col}`:'1.5px solid #e2e8f0',
                    background:sel?col:'white',color:sel?'white':'#334155',
                    boxShadow:sel?`0 1px 5px ${col}44`:'none',transition:'all 0.1s',
                  }}>{num}</button>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

const inp=(w='80px',ex={})=>({border:'1.5px solid #e2e8f0',borderRadius:5,padding:'5px 7px',fontSize:13,width:w,boxSizing:'border-box',fontFamily:'monospace',outline:'none',...ex});
const lbl={fontSize:11,fontWeight:700,color:'#64748b',marginBottom:3,display:'block',letterSpacing:'0.3px'};
const Field=({label,children,w})=>(<div style={{width:w||'auto'}}><span style={lbl}>{label}</span>{children}</div>);

// ── 인포그래픽 바 ────────────────────────────────────────
function CutBar({bin,count,colorMap,kerf,minRemainder,patIdx}){
  const eff=bin.effectiveLength;
  const reusable=bin.remaining>=n(minRemainder);
  const totalUsed=eff-bin.remaining;
  const efficiency=eff>0?((totalUsed/eff)*100).toFixed(1):0;

  return(
    <div style={{marginBottom:8,background:'white',borderRadius:8,
      border:bin.autoAdded?'1.5px solid #fde68a':'1px solid #e2e8f0',overflow:'hidden'}}>

      {/* 패턴 헤더 */}
      <div style={{background:bin.autoAdded?'#fffbeb':'#0f172a',padding:'6px 12px',
        display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          <span style={{background:'#38bdf8',color:'#0f172a',fontWeight:800,fontSize:12,
            borderRadius:4,padding:'1px 8px',fontFamily:'monospace'}}>
            패턴 {patIdx+1}
          </span>
          <span style={{color:bin.autoAdded?'#92400e':'white',fontWeight:800,fontSize:12,fontFamily:'monospace'}}>
            {count}본
          </span>
        </div>
        <span style={{color:bin.autoAdded?'#78350f':'#94a3b8',fontSize:11,fontFamily:'monospace'}}>
          ■ {bin.series}{bin.number} {bin.length}mm
          {bin.frontG>0||bin.backG>0?` (앞G:${bin.frontG}/뒤G:${bin.backG})`:''}
          &nbsp;|&nbsp;유효 {eff}mm
        </span>
        {bin.autoAdded&&(
          <span style={{background:'#f59e0b',color:'white',fontSize:10,fontWeight:700,borderRadius:3,padding:'1px 6px'}}>
            자동배정
          </span>
        )}
        <div style={{marginLeft:'auto',display:'flex',gap:12,alignItems:'center'}}>
          <span style={{color:bin.autoAdded?'#78350f':'#38bdf8',fontWeight:800,fontSize:13}}>
            효율 {efficiency}%
          </span>
          <span style={{color:reusable?'#4ade80':'#f87171',fontWeight:700,fontSize:12}}>
            {reusable?'★':''} 잔재 {bin.remaining.toFixed(0)}mm {reusable?'재사용':'폐기'}
          </span>
        </div>
      </div>

      {/* 비주얼 바 */}
      <div style={{padding:'10px 12px'}}>
        <div style={{position:'relative',width:'100%',height:52,
          display:'flex',borderRadius:5,overflow:'hidden',
          boxShadow:'0 1px 4px rgba(0,0,0,0.08)'}}>
          {bin.assignments.map((a,j)=>{
            const ck=`${a.series}${a.number}-${a.cutLen}`;
            const col=colorMap[ck]||'#94a3b8';
            const segPct=(a.need/eff)*100;
            const actualLen=a.cutLen-n(kerf);
            return(
              <div key={j} style={{
                width:`${segPct}%`,flexShrink:0,background:col,
                borderRight:'1.5px solid rgba(255,255,255,0.4)',
                display:'flex',flexDirection:'column',alignItems:'center',
                justifyContent:'center',overflow:'hidden',cursor:'default',
                position:'relative',
              }}
                title={`[${j+1}] ${a.series}${a.number} 절단:${a.cutLen}mm 실물:${actualLen}mm`}>
                <span style={{fontSize:10,color:'rgba(255,255,255,0.8)',lineHeight:1,marginBottom:1}}>
                  [{j+1}]
                </span>
                <span style={{fontSize:9,color:'white',fontWeight:800,lineHeight:1.1,
                  textAlign:'center',padding:'0 2px',whiteSpace:'nowrap',overflow:'hidden',
                  textOverflow:'ellipsis',maxWidth:'100%'}}>
                  {a.series}{a.number}
                </span>
                <span style={{fontSize:9,color:'rgba(255,255,255,0.85)',lineHeight:1,marginTop:1}}>
                  실{actualLen}
                </span>
              </div>
            );
          })}
          {/* 잔재 */}
          {bin.remaining>0&&(
            <div style={{
              flex:1,minWidth:20,
              background:reusable?'#fef9c3':'#f1f5f9',
              display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
              borderLeft:'1px dashed #cbd5e1',
            }}>
              <span style={{fontSize:10,color:reusable?'#92400e':'#94a3b8',
                fontWeight:700,whiteSpace:'nowrap'}}>
                {reusable?'★':''}{bin.remaining.toFixed(0)}
              </span>
              <span style={{fontSize:9,color:reusable?'#b45309':'#94a3b8'}}>
                {reusable?'보관':'폐기'}
              </span>
            </div>
          )}
        </div>

        {/* 절단 번호 레이블 아래 */}
        <div style={{display:'flex',marginTop:4,gap:0}}>
          {bin.assignments.map((a,j)=>{
            const segPct=(a.need/eff)*100;
            return(
              <div key={j} style={{width:`${segPct}%`,flexShrink:0,
                textAlign:'center',fontSize:9,color:'#64748b',overflow:'hidden'}}>
                {a.cutLen}L
              </div>
            );
          })}
          {bin.remaining>0&&(
            <div style={{flex:1,textAlign:'center',fontSize:9,color:'#94a3b8'}}>
              {bin.remaining.toFixed(0)}
            </div>
          )}
        </div>
      </div>

      {/* 사용량 바 (미니) */}
      <div style={{height:5,background:'#f1f5f9',display:'flex'}}>
        <div style={{width:`${Math.min(100,parseFloat(efficiency))}%`,
          background: parseFloat(efficiency)>=90?'#22c55e':parseFloat(efficiency)>=75?'#f59e0b':'#ef4444',
          transition:'width 0.3s'}}/>
      </div>
    </div>
  );
}

// ── 메인 ─────────────────────────────────────────────────
function App(){
  const [tab,setTab]=useState('input');
  const [settings,setSettings]=useState({
    kerf:'3',minRemainder:'100',stdLength:'3000',
    workNo:'',workDate:today(),worker:'',customer:'',
  });
  const [rawMats,setRawMats]=useState([]);
  const [cutReqs,setCutReqs]=useState([]);
  const [results,setResults]=useState(null);
  const [colorMap,setColorMap]=useState({});

  const [rmIn,setRmIn]=useState({series:'',number:'',length:'',frontG:'0',backG:'0'});
  const [crIn,setCrIn]=useState({series:'',number:'',cutLength:'',frontG:'0',backG:'0',qty:'1'});

  const rmLenRef=useRef(); const rmFGRef=useRef(); const rmBGRef=useRef();
  const crLenRef=useRef(); const crFGRef=useRef(); const crBGRef=useRef(); const crQtyRef=useRef();

  const setSetting=(k,v)=>setSettings(s=>({...s,[k]:v}));
  const effLen=rm=>{const v=n(rm.length)-n(rm.frontG)-n(rm.backG);return v>0?v:'-';};
  const physLen=cutLen=>Math.max(0,n(cutLen)-n(settings.kerf));

  const canRM=rmIn.series&&rmIn.number&&rmIn.length;
  const selectRM=(series,number)=>{
    setRmIn(p=>({...p,series,number}));
    setTimeout(()=>{rmLenRef.current?.focus();rmLenRef.current?.select();},30);
  };
  const addRM=()=>{
    if(!canRM) return;
    setRawMats(p=>[...p,{id:uid(),...rmIn}]);
    setRmIn({series:'',number:'',length:'',frontG:rmIn.frontG,backG:rmIn.backG});
  };

  const canCR=crIn.series&&crIn.number&&crIn.cutLength;
  const selectCR=(series,number)=>{
    setCrIn(p=>({...p,series,number}));
    setTimeout(()=>{crLenRef.current?.focus();crLenRef.current?.select();},30);
  };
  const addCR=()=>{
    if(!canCR) return;
    if(cutReqs.length>=MAX_CUT){alert(`절단 요구는 최대 ${MAX_CUT}개까지입니다.`);return;}
    setCutReqs(p=>[...p,{id:uid(),...crIn}]);
    setCrIn({series:'',number:'',cutLength:'',frontG:crIn.frontG,backG:crIn.backG,qty:'1'});
  };

  const handleOptimize=()=>{
    const res=optimize(rawMats,cutReqs,settings.kerf,settings.minRemainder,settings.stdLength);
    const cm=buildColorMap(cutReqs);
    setResults(res);
    setColorMap(cm);
    setTab('result');
  };

  // 결과 통계
  const stats=results?{
    totalBars:results.bins.length,
    autoBars:results.bins.filter(b=>b.autoAdded).length,
    totalEffective:results.bins.reduce((s,b)=>s+b.effectiveLength,0),
    totalWaste:results.bins.reduce((s,b)=>s+b.remaining,0),
    reusableWaste:results.bins.filter(b=>b.remaining>=n(settings.minRemainder)).reduce((s,b)=>s+b.remaining,0),
    reusableCount:results.bins.filter(b=>b.remaining>=n(settings.minRemainder)).length,
    patterns:groupPatterns(results.bins).length,
    totalCuts:results.bins.reduce((s,b)=>s+b.assignments.length,0),
    efficiency:0,
  }:null;
  if(stats) stats.efficiency=(((stats.totalEffective-stats.totalWaste)/stats.totalEffective)*100).toFixed(1);

  // 수량 검증
  const verification=results&&cutReqs.map((cr,i)=>{
    const required=ni(cr.qty)||1;
    const produced=results.bins.reduce((s,b)=>
      s+b.assignments.filter(a=>a.reqIdx===i).length,0);
    return{...cr,required,produced,diff:produced-required};
  });

  const canOptimize=cutReqs.length>0;

  return(
    <div style={{fontFamily:'"Pretendard","Apple SD Gothic Neo",sans-serif',background:'#f1f5f9',minHeight:'100vh'}}>

      {/* 헤더 */}
      <div style={{background:'#0f172a',color:'white',padding:'11px 16px',
        display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div>
          <div style={{fontSize:15,fontWeight:800,letterSpacing:'-0.5px'}}>
            LM 가이드 레일 절단 최적화{' '}
            <span style={{fontSize:11,color:'#38bdf8',fontWeight:600}}>v7</span>
          </div>
          <div style={{fontSize:10,color:'#64748b',marginTop:1}}>
            HSR · SR · SHS · SRS · SRSW | FFD + 원자재 자동 배정 | 대구·경북
          </div>
        </div>
        <div style={{fontSize:11,color:'#475569',textAlign:'right'}}>
          원자재 {rawMats.length}종 · 절단요구 {cutReqs.length}종
        </div>
      </div>

      {/* 탭 */}
      <div style={{background:'#1e293b',display:'flex',padding:'0 8px',gap:2}}>
        {[['input','① 입력'],['result','② 결과 / 작업지시서'],['pitch','피치 DB']].map(([k,label])=>(
          <button key={k} onClick={()=>setTab(k)} style={{
            padding:'8px 14px',fontSize:12,fontWeight:600,border:'none',cursor:'pointer',
            background:'none',color:tab===k?'white':'#64748b',
            borderBottom:tab===k?'2.5px solid #38bdf8':'2.5px solid transparent',
          }}>{label}</button>
        ))}
      </div>

      <div style={{padding:'12px',maxWidth:960,margin:'0 auto'}}>

        {/* ═══ 입력 탭 ═══ */}
        {tab==='input'&&<>

          {/* 기본 설정 */}
          <div style={{background:'white',borderRadius:8,padding:'10px 12px',marginBottom:10,border:'1px solid #e2e8f0'}}>
            <div style={{fontSize:11,fontWeight:800,color:'#94a3b8',letterSpacing:'1px',marginBottom:8}}>기본 설정</div>
            <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'flex-end'}}>
              {[['절단날 손실 kerf (mm)','kerf','60px'],['최소 재사용 잔재 (mm)','minRemainder','70px'],
                ['표준 원자재 길이 (mm)','stdLength','80px'],['작업번호','workNo','80px'],
                ['작업일','workDate','90px'],['담당자','worker','70px'],['거래처','customer','110px']
              ].map(([label,key,w])=>(
                <div key={key}>
                  <span style={lbl}>{label}</span>
                  <input value={settings[key]} onChange={e=>setSetting(key,e.target.value)} style={inp(w)}/>
                </div>
              ))}
            </div>
            <div style={{marginTop:8,padding:'6px 10px',background:'#f0f9ff',borderRadius:6,fontSize:11,color:'#0369a1'}}>
              💡 <b>원자재 입력은 선택사항</b> — 비워두면 절단 요구 기준으로 표준 원자재({settings.stdLength}mm)를 자동 배정합니다.
            </div>
          </div>

          {/* 원자재 */}
          <div style={{background:'white',borderRadius:8,padding:'10px 12px',marginBottom:10,border:'1px solid #e2e8f0'}}>
            <div style={{fontSize:11,fontWeight:800,color:'#94a3b8',letterSpacing:'1px',marginBottom:8}}>
              원자재 투입 ({rawMats.length}종)
            </div>
            {rawMats.length>0&&(
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:12,marginBottom:10}}>
                <thead><tr style={{background:'#f8fafc'}}>
                  {['No','규격','길이(mm)','앞G','뒤G','유효길이',''].map((h,j)=>(
                    <th key={j} style={{padding:'4px 8px',textAlign:j<2?'left':'right',
                      fontWeight:700,color:'#64748b',borderBottom:'1.5px solid #e2e8f0',fontSize:11}}>{h}</th>
                  ))}
                </tr></thead>
                <tbody>
                  {rawMats.map((rm,idx)=>(
                    <tr key={rm.id} style={{borderBottom:'1px solid #f1f5f9',background:idx%2===0?'white':'#fafafa'}}>
                      <td style={{padding:'4px 8px',color:'#94a3b8'}}>{idx+1}</td>
                      <td style={{padding:'4px 8px'}}>
                        <span style={{fontWeight:800,color:SERIES_COLORS[rm.series],fontFamily:'monospace',fontSize:13}}>
                          {rm.series}{rm.number}
                        </span>
                      </td>
                      <td style={{padding:'4px 8px',textAlign:'right',fontFamily:'monospace'}}>{rm.length}</td>
                      <td style={{padding:'4px 8px',textAlign:'right',fontFamily:'monospace',color:'#64748b'}}>{rm.frontG}</td>
                      <td style={{padding:'4px 8px',textAlign:'right',fontFamily:'monospace',color:'#64748b'}}>{rm.backG}</td>
                      <td style={{padding:'4px 8px',textAlign:'right',fontFamily:'monospace',fontWeight:700,color:'#059669'}}>{effLen(rm)}</td>
                      <td style={{textAlign:'center'}}>
                        <button onClick={()=>setRawMats(p=>p.filter(x=>x.id!==rm.id))}
                          style={{background:'none',border:'none',color:'#ef4444',cursor:'pointer',fontSize:14,padding:'0 4px'}}>✕</button>

              </div>

              <button onClick={()=>window.print()}
                style={{width:'100%',padding:11,fontSize:14,fontWeight:700,border:'none',
                  borderRadius:8,background:'#1e293b',color:'white',cursor:'pointer'}}>
                🖨 인쇄
              </button>
            </div>
          )
        )}

        {/* ═══ 피치 DB 탭 ═══ */}
        {tab==='pitch'&&(
          <div style={{background:'white',borderRadius:8,padding:'12px 14px',border:'1px solid #e2e8f0'}}>
            <div style={{fontWeight:800,fontSize:13,color:'#0f172a',marginBottom:4}}>규격별 피치 기준표</div>
            <div style={{fontSize:11,color:'#94a3b8',marginBottom:12}}>
              피치 = 볼트 홀 간격(mm) | G값은 별도 직접 입력
            </div>
            {Object.entries(PITCH_DB).map(([series,nums])=>(
              <div key={series} style={{marginBottom:14}}>
                <div style={{fontWeight:800,color:SERIES_COLORS[series],marginBottom:5,fontFamily:'monospace',fontSize:13}}>{series}</div>
                <table style={{borderCollapse:'collapse',fontSize:12}}>
                  <thead><tr>
                    <th style={{padding:'4px 12px',background:'#f8fafc',border:'1px solid #e2e8f0',fontWeight:700,color:'#64748b',fontSize:11}}>번호</th>
                    {Object.keys(nums).map(num=>(
                      <th key={num} style={{padding:'4px 14px',background:'#f8fafc',border:'1px solid #e2e8f0',fontFamily:'monospace',fontWeight:700,color:'#334155'}}>{num}</th>
                    ))}
                  </tr></thead>
                  <tbody><tr>
                    <td style={{padding:'4px 12px',border:'1px solid #e2e8f0',fontWeight:700,color:'#64748b',fontSize:11}}>피치(mm)</td>
                    {Object.values(nums).map((p,j)=>(
                      <td key={j} style={{padding:'4px 14px',border:'1px solid #e2e8f0',textAlign:'right',
                        fontFamily:'monospace',fontWeight:700,color:SERIES_COLORS[series]}}>{p}</td>
                    ))}
                  </tr></tbody>
                </table>
              </div>
            ))}
          </div>
        )}

      </div>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
